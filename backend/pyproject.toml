[project]
name = "medicare-plan-selector"
version = "0.1.0"
description = "Independent, free Medicare plan comparison tool (estimates only; not an agent or broker)."
license = "GPL-3.0-only"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pymysql>=1.1.1",
    "cryptography>=43",
    "redis>=5.2",
    "httpx>=0.28",
    "pyyaml>=6.0.2",
    "anthropic>=0.40",
    "openai>=1.55",
]

[project.scripts]
selector = "selector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "infra: needs the compose MySQL/Redis test stack (make test brings it up)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S608"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["selector"]
plugins = ["pydantic.mypy"]
