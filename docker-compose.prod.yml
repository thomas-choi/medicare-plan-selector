# Production stack for med.thomas-choi.com (DESIGN §10). Standalone file (not an override of the dev compose):
#   docker compose --env-file .env.prod -f docker-compose.prod.yml up -d      (or: make prod-up)
# Settings and secrets come from .env.prod only (repo root, mode 600, never committed), never from the dev .env.
# `env_file` below hands it to the containers; `--env-file .env.prod` is still needed on the command line because
# Compose fills the ${...} values in this file from ./.env unless told otherwise. See deploy/README.md.
#
# MySQL is DigitalOcean Managed MySQL, not a container here: TLS on port 25060, admin user `doadmin` (no root).
# The containers and the host-side `make migrate` / `make ingest` use the same URLs from .env.prod. TLS comes from
# MSP_DB_CA_FILE (the DO CA certificate, e.g. ./cert/do.ca.crt, relative to the repo root): the app passes it to
# PyMySQL, so the URLs need no ?ssl_ca=. The containers get the file at /run/msp/do.ca.crt and that path in
# MSP_DB_CA_FILE.
# Redis stays app-local (DESIGN-v0.4-ADDENDUM A10). Only the web container is published, on 127.0.0.1: the host
# nginx terminates TLS and proxies to it.
name: msp-prod

x-app: &app
  image: ${DOCKER_USER:-local}/medicare-plan-selector:${IMAGE_TAG:-latest}
  build:
    context: ./backend
    args:
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}
  env_file:
    - path: .env.prod
      required: true
  environment: &app-env
    # DATABASE_URL (the API role on DO) comes only from env_file .env.prod, never from the shell; containers never
    # get the ingest/migrator roles.
    MSP_DB_CA_FILE: /run/msp/do.ca.crt
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}@redis:6379/0
    INGEST_DATABASE_URL: ""
    MIGRATOR_DATABASE_URL: ""
    # DESIGN v0.5 B2 (NS-REQ): No-save is the default and wins over .env.prod; any other value stops the API.
    DEFAULT_SESSION_MODE: nosave
  volumes:
    - type: bind
      source: ${MSP_DB_CA_FILE:?set MSP_DB_CA_FILE in .env.prod (the DO CA certificate, e.g. ./cert/do.ca.crt)}
      target: /run/msp/do.ca.crt
      read_only: true
  depends_on:
    redis: { condition: service_healthy }
  read_only: true
  tmpfs:
    - /tmp
  ulimits:
    core: 0
  restart: unless-stopped

services:
  redis:
    image: redis:7.4
    # No persistence (DESIGN §8.5): no RDB, no AOF, /data on tmpfs, no core dumps.
    command:
      - sh
      - -c
      - exec redis-server --save "" --appendonly no --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy volatile-ttl
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
    tmpfs:
      - /data
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    <<: *app
    command: ["api"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      # Merged into the x-app map (DESIGN v0.5 B2 pin included), not a copy of it.
      <<: *app-env
      API_WORKERS: ${API_WORKERS:-2}

  purge:
    <<: *app
    command: ["purge-loop"]

  web:
    image: ${DOCKER_USER:-local}/medicare-plan-selector-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    depends_on:
      api: { condition: service_healthy }
    ports:
      # Blank/unset MSP_WEB_BIND = loopback only, for the host nginx (deploy/README.md section 4). A LAN IP or
      # 0.0.0.0 serves plain HTTP to the LAN without nginx: trusted networks only, with COOKIE_SECURE=false.
      - "${MSP_WEB_BIND:-127.0.0.1}:${MSP_WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
