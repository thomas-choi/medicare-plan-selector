# Local development and test stack. Ports bind to 127.0.0.1 only; passwords here are dev-only placeholders.
# Production uses docker-compose.prod.yml with secrets from the server .env.
name: msp

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev-root-pw
    ports:
      - "127.0.0.1:${MSP_MYSQL_PORT:-3307}:3306"
    volumes:
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdev-root-pw --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7.4
    # No persistence (DESIGN §8.5): no RDB snapshots, no AOF, data dir on tmpfs.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - dev-redis-pw
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - "127.0.0.1:${MSP_REDIS_PORT:-6380}:6379"
    tmpfs:
      - /data
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev-redis-pw", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: ["app"]
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://msp_api:dev-api-pw@mysql:3306/msp
      REDIS_URL: redis://:dev-redis-pw@redis:6379/0
      LLM_PROVIDER: fake
      COOKIE_SECURE: "false"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${MSP_API_PORT:-8000}:8000"
    ulimits:
      core: 0
