# Local development and test stack. Ports bind to 127.0.0.1 unless MSP_DB_BIND / MSP_WEB_BIND say otherwise;
# passwords here are dev-only placeholders (public in this repo), so publish MySQL/Redis only on a trusted LAN.
# Production uses docker-compose.prod.yml with secrets from the server .env.
name: msp

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev-root-pw
    ports:
      # MSP_DB_BIND=<this machine's LAN IP> lets another coding host use this stack (README); blank = loopback.
      - "${MSP_DB_BIND:-127.0.0.1}:${MSP_MYSQL_PORT:-3307}:3306"
    volumes:
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pdev-root-pw --silent"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7.4
    # No persistence (DESIGN §8.5): no RDB snapshots, no AOF, data dir on tmpfs.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - dev-redis-pw
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - "${MSP_DB_BIND:-127.0.0.1}:${MSP_REDIS_PORT:-6380}:6379"
    tmpfs:
      - /data
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dev-redis-pw", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    profiles: ["app"]
    image: ${DOCKER_USER:-local}/medicare-plan-selector:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    # The repo-root .env supplies LLM, quota and privacy settings. Its DATABASE_URL/REDIS_URL are the host-side
    # values (127.0.0.1:3307 / :6380), so the dev stack overrides them below with the container service names.
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-mysql+pymysql://msp_api:dev-api-pw@mysql:3306/msp}
      INGEST_DATABASE_URL: ${COMPOSE_INGEST_DATABASE_URL:-mysql+pymysql://msp_ingest:dev-ingest-pw@mysql:3306/msp}
      MIGRATOR_DATABASE_URL: ${COMPOSE_MIGRATOR_DATABASE_URL:-mysql+pymysql://msp_migrator:dev-migrator-pw@mysql:3306/msp}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://:dev-redis-pw@redis:6379/0}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      COOKIE_SECURE: "false"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${MSP_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      # /api/ready is 503 until plan data is loaded, so `make app-up` fails loudly on an empty database.
      interval: 3s
      timeout: 5s
      start_period: 10s
      retries: 15
    ulimits:
      core: 0
    read_only: true
    tmpfs:
      - /tmp

  web:
    profiles: ["app"]
    image: ${DOCKER_USER:-local}/medicare-plan-selector-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
    depends_on:
      api: { condition: service_healthy }
    ports:
      # Blank/unset MSP_WEB_BIND = loopback only (`:-` covers both); set a LAN IP to reach the dev UI from the LAN.
      - "${MSP_WEB_BIND:-127.0.0.1}:${MSP_WEB_PORT:-8080}:8080"
