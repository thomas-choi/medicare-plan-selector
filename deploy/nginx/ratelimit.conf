# Rate limits (DESIGN §8.2). Included in the `http {}` context of the host nginx (see med.conf.template, which
# applies the zones per location). Keys use the binary address; nothing here is logged.
limit_req_zone  $binary_remote_addr zone=msp_api:10m  rate=30r/m;
limit_req_zone  $binary_remote_addr zone=msp_chat:10m rate=6r/m;
limit_conn_zone $binary_remote_addr zone=msp_conn:10m;
limit_req_status  429;
limit_conn_status 429;
